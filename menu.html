  <div class="menu_flex">
    <div class="menu_card">
      <figure>
      <img src="img/1menu.png" alt="シンプルドーナッツ">
      <h4>シンプルドーナッツ</h4>
      <figcaption><p>素材のやさしい甘さを楽しめる、当店定番の人気ドーナッツ。</p></figcaption>
      <p class="price">¥200(税込)</p></figure>
    </div>

    <div class="menu_card">
      <figure>
      <img src="img/2menu.png" alt="チョコレートドーナッツ">
      <h4>チョコレートドーナッツ</h4>
      <figcaption><p>ほろ苦いチョコレートをたっぷり使用した、大人の味わい。</p></figcaption>
      <p class="price">¥300(税込)</p></figure>
    </div>

    <div class="menu_card">
      <figure>
      <img src="img/3menu.png" alt="いちごドーナッツ">
      <h4>いちごドーナッツ</h4>
      <figcaption><p>甘酸っぱいいちごの風味が広がる、見た目もかわいい一品。</p></figcaption>
      <p class="price">¥350(税込)</p></figure>
    </div>

    <div class="menu_card">
      <figure>
      <img src="img/4menu.png" alt="ホワイトチョコドーナッツ">
      <h4>ホワイトチョコドーナッツ</h4>
      <figcaption><p>ミルキーな甘さのホワイトチョコで包んだ贅沢なドーナッツ。</p></figcaption>
      <p class="price">¥360(税込)</p></figure>
    </div>

    <div class="menu_card">
      <figure><img src="img/5menu.png" alt="">
      <h4>キャラメルソースドーナッツ</h4>
      <figcaption><p>香ばしいキャラメルソースがとろける、やさしい甘さのドーナッツ。</p></figcaption>
      <p class="price">¥380(税込)</p></figure>
    </div>

    <div class="menu_card">
      <figure><img src="img/6menu.png" alt="">
      <h4>Wチョコレートドーナッツ</h4>
      <figcaption><p>チョコレート好きにおすすめ。濃厚な甘さをたっぷり楽しめます。</p></figcaption>
      <p class="price">¥400(税込)</p></figure>
    </div>

    <div class="menu_card">
      <figure><img src="img/7menu.png" alt="">
      <h4>抹茶ナッツドーナッツ</h4>
      <figcaption><p>ほろ苦い抹茶と香ばしいナッツが相性抜群の和風ドーナッツ。</p></figcaption>
      <p class="price">¥300(税込)</p></figure>
    </div>

    <div class="menu_card">
      <figure><img src="img/8menu.png" alt="">
      <h4>ブルーベリードーナッツ</h4>
      <figcaption><p>ブルーベリーの甘酸っぱさが広がる、さわやかな味わい。</p></figcaption>
      <p class="price">¥310(税込)</p></figure>
    </div>

    <div class="menu_card">
      <figure><img src="img/9menu.png" alt="">
      <h4>チョコチップドーナッツ</h4>
      <figcaption><p>たっぷりのチョコチップが楽しい、食感も楽しめる人気商品。</p></figcaption>
      <p class="price">¥340(税込)</p></figure>
    </div>

    <div class="menu_card">
      <figure><img src="img/10menu.png" alt="">
      <h4>ベリーベリードーナッツ</h4>
      <figcaption><p>甘酸っぱいベリーを贅沢に使用した華やかなドーナッツ。</p></figcaption>
      <p class="price">¥360(税込)</p></figure>
    </div>
  </div>

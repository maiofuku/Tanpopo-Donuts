<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">

  <!-- reset.css ress -->

  <!-- 言語設定 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kaisei+Decol&display=swap" rel="stylesheet">

  <title>たんぽぽ ドーナッツ</title>

</head>

<body>
  <header class="page-header">
    <div class="logobox">
      <h1 class="align-center">
        <a href="index.html"><img class="logo" src="img/tanpopodounut.png" alt="ロゴ">
          たんぽぽ ドーナッツ</a>
      </h1>
    </div>

    <nav>
      <ul class="main-nav">
        <!-- <li><a href="#shop-about">私たち</a></li> -->
        <li><a href="menu.html">商品紹介</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><a href="#access">店舗情報</a></li>
      </ul>
    </nav>

  </header>


  <div class="contact_top">
    <img class="top-top" src="img/9.png" alt="ドーナッツの画像">
    <p>Contact</p>
  </div>

  <div class="inner">
  <div id="line">
    <img src="img/line_top.png">
  </div>
  </div>

  <section class="contact">
    <form>
      <h3 class="heading-large" id="contact">お問い合わせ</h3>
      <p>
        お気軽にお問い合わせください。
      </p>

      <p>名前：<input class="name" type="text" placeholder="山田　太郎"></p>

      <p>
        性別：
        <input class="gender" type="radio" name="gender" value="男性">男性
        <input class="gender" type="radio" name="gender" value="女性">女性
        <input class="gender" type="radio" name="gender" value="その他">その他
      </p>

      <p>お問い合わせ内容：
        <select class="option" name="option">
          <option value="選択ください">選択ください</option>
          <option value="商品について">商品について</option>
          <option value="送料・支払方法">送料・支払方法</option>
          <option value="採用情報">採用情報</option>
          <option value="その他">その他</option>
        </select>
      </p>

      <div class="box">
        <p>詳細：</p>
        <textarea class="message" name="message" placeholder="詳細をご記入ください"></textarea>
      </div>

      <div class="box_02">
        <input class="action" type="image" src="img/botan.png" alt="送信する" value="送信する">
      </div>
    </form>
  </section>

   <div class="inner">
  <div id="line">
    <img src="img/line_bottom.png">
  </div>
   </div>
   
  <footer class="page-footer">

    <h3 class="heading-large" id="access">店舗情報</h3>

    <div class="info-map">
      <table class="info">
        <tr>
          <th>住所</th>
          <td>東京都港区麻布X-X-X</td>
        </tr>
        <tr>
          <th>電話</th>
          <td>000-1234-5678</td>
        </tr>
        <tr>
          <th>営業時間</th>
          <td>10:00~20:00</td>
        </tr>
        <tr>
          <th>店休日</th>
          <td>不定休</td>
        </tr>
      </table>

      <div class="map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m14!1m8!1m3!1d1620.9188836164953!2d139.73758905320676!3d35.65636848888007!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x60188b9f05165cdf%3A0x6af41c4f54a76872!2z6bq75biD5Y2B55Wq6aeF!5e0!3m2!1sja!2sjp!4v1780150798732!5m2!1sja!2sjp"
          width="800" height="600" style="border:0;" allowfullscreen="" loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"></iframe>
      </div>
    </div>

    <div class="copyright">
      <small>&copy; 2026 たんぽぽ ドーナッツ</small>
    </div>
  </footer>

</body>

</html>
